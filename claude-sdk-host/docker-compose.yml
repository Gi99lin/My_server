# ==============================================================================
# Claude SDK Host Stack
#
# Four-service layout:
# 1. sdk-netguard: Host namespace owner (NET_ADMIN, atomic nftables default-drop)
# 2. claude-sdk-host: Unprivileged API & SDK/browser executor (network_mode: service:sdk-netguard)
# 3. sdk-egress-guard: Egress namespace owner (NET_ADMIN, strictly restricts uplink to upstream proxy)
# 4. sdk-egress: Unprivileged forwarder enforcing mandatory upstream chaining (network_mode: service:sdk-egress-guard)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Network Namespace Guard for Host (Namespace Owner for claude-sdk-host)
  # ----------------------------------------------------------------------------
  sdk-netguard:
    build:
      context: .
      dockerfile: deploy/netguard/Dockerfile
    image: claude-sdk-netguard:local
    container_name: claude-sdk-netguard
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    networks:
      sdk_clients:
        ipv4_address: ${NETGUARD_CLIENTS_IP:-10.253.240.2}
        aliases:
          - claude-sdk-host
      sdk_tools:
        ipv4_address: ${NETGUARD_TOOLS_IP:-10.253.240.18}
        aliases:
          - claude-sdk-host
      sdk_proxy:
        ipv4_address: ${NETGUARD_PROXY_IP:-10.253.240.34}
        aliases:
          - claude-sdk-host
    volumes:
      - claude-network-state:/run/netguard
      - ${HOSTS_FILE:-./deploy/hosts}:/etc/hosts:ro
    tmpfs:
      - /tmp:size=16M,mode=1777
    environment:
      ROLE: host
      CLIENTS_SUBNET: ${SDK_CLIENTS_SUBNET:-10.253.240.0/28}
      TOOLS_SUBNET: ${SDK_TOOLS_SUBNET:-10.253.240.16/28}
      PROXY_IP: ${EGRESS_PROXY_IP:-10.253.240.35}
      PROXY_PORT: 8080
      API_PORT: 8080
      ALLOWED_INTERNAL_IPS: ${ALLOWED_INTERNAL_IPS:-10.253.240.20,10.253.240.21,10.253.240.22}
      ALLOWED_INTERNAL_PORTS: ${ALLOWED_INTERNAL_PORTS:-8000,8443,42000-42999}
    healthcheck:
      test: ["CMD", "nft", "list", "table", "inet", "netguard"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # ----------------------------------------------------------------------------
  # 2. Claude SDK Host (API, Session Supervisor, Chromium & SDK Executor)
  # ----------------------------------------------------------------------------
  claude-sdk-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-sdk-host:local
    container_name: claude-sdk-host
    restart: unless-stopped
    network_mode: "service:sdk-netguard"
    depends_on:
      sdk-netguard:
        condition: service_healthy
      sdk-egress:
        condition: service_healthy
    init: true
    ipc: private
    shm_size: ${HOST_SHM_SIZE:-512m}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:deploy/seccomp/seccomp-host.json
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    deploy:
      resources:
        limits:
          cpus: "${HOST_CPUS:-2.0}"
          memory: "${HOST_MEMORY:-4GiB}"
          pids: ${HOST_PIDS:-512}
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CLAUDE_HOST_CONFIG: "/run/secrets/host-config.json"
      CLAUDE_CONFIG_DIR: "/var/lib/claude-auth"
      HTTP_PROXY: "http://${EGRESS_PROXY_IP:-10.253.240.35}:8080"
      HTTPS_PROXY: "http://${EGRESS_PROXY_IP:-10.253.240.35}:8080"
      http_proxy: "http://${EGRESS_PROXY_IP:-10.253.240.35}:8080"
      https_proxy: "http://${EGRESS_PROXY_IP:-10.253.240.35}:8080"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,10.253.240.20,10.253.240.21,10.253.240.22}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,10.253.240.20,10.253.240.21,10.253.240.22}"
    volumes:
      - ${HOST_SECRETS_DIR:?Set HOST_SECRETS_DIR to an operator-owned directory outside Git}:/run/secrets:ro
      - claude-network-state:/run/netguard:ro
      - claude-auth:/var/lib/claude-auth
      - claude-journal:/var/lib/claude-host
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /tmp/claude-host:size=256M,mode=1777
    command: ["serve"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); assert json.load(o.open('http://127.0.0.1:8080/health/live',timeout=2))['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Network Namespace Guard for Egress (Namespace Owner for sdk-egress)
  # ----------------------------------------------------------------------------
  sdk-egress-guard:
    build:
      context: .
      dockerfile: deploy/netguard/Dockerfile
    image: claude-sdk-netguard:local
    container_name: claude-sdk-egress-guard
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    networks:
      sdk_proxy:
        ipv4_address: ${EGRESS_PROXY_IP:-10.253.240.35}
        aliases:
          - sdk-egress
      sdk_upstream:
        ipv4_address: ${EGRESS_UPSTREAM_CLIENT_IP:-10.253.240.50}
        aliases:
          - sdk-egress
    volumes:
      - ${HOSTS_FILE:-./deploy/hosts}:/etc/hosts:ro
    tmpfs:
      - /tmp:size=16M,mode=1777
    environment:
      ROLE: egress
      PROXY_SUBNET: ${SDK_PROXY_SUBNET:-10.253.240.32/28}
      LISTEN_PORT: 8080
      UPSTREAM_IPS: ${EGRESS_UPSTREAM_IP:?Set numeric upstream proxy IP}
      UPSTREAM_PORTS: ${EGRESS_UPSTREAM_PORT:-1080}
    healthcheck:
      test: ["CMD", "nft", "list", "table", "inet", "netguard"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # ----------------------------------------------------------------------------
  # 4. Egress Proxy Forwarder (Unprivileged GOST with Mandatory Upstream Chaining)
  # ----------------------------------------------------------------------------
  sdk-egress:
    build:
      context: .
      dockerfile: deploy/egress/Dockerfile
    image: claude-sdk-egress:local
    container_name: claude-sdk-egress
    user: "1000:1000"
    restart: unless-stopped
    network_mode: "service:sdk-egress-guard"
    depends_on:
      sdk-egress-guard:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${HOST_SECRETS_DIR:?Set HOST_SECRETS_DIR to an operator-owned directory outside Git}/gost-config.json:/run/secrets/gost-config.json:ro
    tmpfs:
      - /tmp:size=16M,mode=1777
    environment:
      CONFIG_FILE: "/run/secrets/gost-config.json"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

# ==============================================================================
# Dedicated Isolated Networks (Non-overlapping /28 subnets)
# ==============================================================================
networks:
  # Internal: API callers (TMS backend/worker) to netguard API listener
  sdk_clients:
    name: claude_sdk_clients
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: ${SDK_CLIENTS_SUBNET:-10.253.240.0/28}
          gateway: ${SDK_CLIENTS_GATEWAY:-10.253.240.1}

  # Internal: Registered tool, MCP, credential and stand endpoints
  sdk_tools:
    name: claude_sdk_tools
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: ${SDK_TOOLS_SUBNET:-10.253.240.16/28}
          gateway: ${SDK_TOOLS_GATEWAY:-10.253.240.17}

  # Internal: netguard egress-proxy interface to sdk-egress HTTP listener
  sdk_proxy:
    name: claude_sdk_proxy
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: ${SDK_PROXY_SUBNET:-10.253.240.32/28}
          gateway: ${SDK_PROXY_GATEWAY:-10.253.240.33}

  # Uplink: sdk-egress-guard connection to external/host upstream proxy
  sdk_upstream:
    name: claude_sdk_upstream
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
        - subnet: ${SDK_UPSTREAM_SUBNET:-10.253.240.48/28}
          gateway: ${SDK_UPSTREAM_GATEWAY:-10.253.240.49}

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  claude-network-state:
    name: claude_sdk_network_state
  # Restricted official Claude authentication state
  claude-auth:
    name: claude_sdk_auth
  # SQLite durable journal and accounting database
  claude-journal:
    name: claude_sdk_journal
