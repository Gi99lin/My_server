[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "personal-claude-host"
version = "0.1.0"
description = "Private personal Claude Agent SDK executor with local browser tools"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.174",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "playwright==1.64.1",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_host"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
