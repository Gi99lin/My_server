# Scrapes this box's own infrastructure: itself, cAdvisor (per-container
# CPU/memory/network for every container on the box) and node-exporter
# (host-level stats).
#
# Shared server-wide instance — if a specific project wants its own app
# metrics scraped, add a job here rather than standing up a second
# Prometheus. Ask before adding a job that changes existing ones.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["10.10.10.10:9100", "node-exporter:9100", "10.10.30.10:9100", "10.10.40.10:9100", "10.10.50.10:9100", "10.10.60.10:9100", "10.10.70.10:9100"]
