# Apply after the pinned upstream docker/docker-compose.yaml.
services:
  nginx:
    ports: !override
      - "127.0.0.1:18080:80"

  plugin_daemon:
    ports: !reset []
    # Our own plugins (the TMS agent strategy) are signed with our key; Dify's own signature check stays on.
    # The public key lives in the daemon's storage volume: volumes/plugin_daemon/keys/tms_plugins.public.pem.
    # The private key is on gigglin-agents in ~/.config/dify-pilot/signing (mode 600), never in Git.
    environment:
      THIRD_PARTY_SIGNATURE_VERIFICATION_ENABLED: "true"
      THIRD_PARTY_SIGNATURE_VERIFICATION_PUBLIC_KEYS: /app/storage/keys/tms_plugins.public.pem
      # An agent strategy runs as one plugin call for the whole session. With screenshots a TMS session runs past the
      # default 600 s and Dify killed it ("killed by timeout", 2026-11-24). The TMS keeps its own time limits.
      PLUGIN_MAX_EXECUTION_TIMEOUT: "3600"

  api:
    environment:
      PLUGIN_DAEMON_TIMEOUT: "3600.0"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "3600"

  worker:
    environment:
      PLUGIN_DAEMON_TIMEOUT: "3600.0"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "3600"

  web:
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

