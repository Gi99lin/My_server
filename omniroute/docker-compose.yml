services:
  omniroute:
    container_name: omniroute
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=0.0.0.0
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - TZ=Europe/Moscow
    ports:
      - "0.0.0.0:${OMNIROUTE_DASHBOARD_PORT:-20130}:${PORT:-20128}"
      - "0.0.0.0:${OMNIROUTE_API_PORT:-20131}:${API_PORT:-20129}"
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  omniroute_data:
    external: true
    name: omniroute_data
