services:
  # ==================== MCP Telegram Cloud ====================
  # Self-hosted, single-operator-mode instance of
  # https://github.com/mcp-telegram/mcp-telegram-cloud (fork:
  # https://github.com/Gi99lin/mcp-telegram-cloud). Image is built by the
  # fork's own GitHub Actions workflow on every push to main — no build here.
  mcp-telegram-cloud:
    container_name: mcp-telegram-cloud
    image: ghcr.io/gi99lin/mcp-telegram-cloud:latest
    restart: unless-stopped
    pull_policy: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    env_file: .env
    volumes:
      - mcp_telegram_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy_network
    # No host port published: nginx-proxy-manager reaches this container by
    # name (mcp-telegram-cloud:3000) over proxy_network, same as manager-helper.

# ==================== Networks & Volumes ====================
networks:
  proxy_network:
    external: true
    name: my_server_proxy_network

volumes:
  mcp_telegram_data:
    name: mcp-telegram-cloud-data
