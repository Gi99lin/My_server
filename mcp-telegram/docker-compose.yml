services:
  mcp-telegram-cloud:
    container_name: mcp-telegram-cloud
    image: ghcr.io/gi99lin/mcp-telegram-cloud:latest
    restart: unless-stopped
    pull_policy: if_not_present
    labels:
      - com.centurylinklabs.watchtower.enable=true
    env_file: .env
    ports:
      - "0.0.0.0:3003:3000"
    volumes:
      - mcp_telegram_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mcp_telegram_data:
    name: mcp-telegram-cloud-data
